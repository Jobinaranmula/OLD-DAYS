<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>OLD DAYS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SCREEN 2 -->
  <main class="screen2">

    <!-- Background -->
    <div class="screen2-overlay"></div>

    <div class="screen2-content">

      <div class="memory-top">
        TERRITORY BOYS PRESENTS
      </div>

      <h1>OLD DAYS</h1>

      <p class="memory-subtitle">
        Friends · Cricket · Rain · Memories
      </p>


      <!-- MAIN MP3 PLAYER -->
      <div class="main-player">

        <button id="mainPlay">
          ▶ PLAY
        </button>

        <audio id="mainAudio" src="old-days.mp3"></audio>

      </div>


      <!-- AMBIENT SOUND CONTROLS -->
      <div class="sound-panel">

        <!-- NATURE -->
        <div class="sound-row">

          <div class="sound-name">
            🌿 Nature
          </div>

          <button
            class="toggle"
            data-audio="natureAudio">
            ON
          </button>

          <input
            type="range"
            min="0"
            max="100"
            value="50"
            data-volume="natureAudio">

        </div>


        <!-- RAIN -->
        <div class="sound-row">

          <div class="sound-name">
            🌧️ Rain
          </div>

          <button
            class="toggle"
            data-audio="rainAudio">
            ON
          </button>

          <input
            type="range"
            min="0"
            max="100"
            value="35"
            data-volume="rainAudio">

        </div>


        <!-- CRICKET -->
        <div class="sound-row">

          <div class="sound-name">
            🏏 Cricket
          </div>

          <button
            class="toggle"
            data-audio="cricketAudio">
            ON
          </button>

          <input
            type="range"
            min="0"
            max="100"
            value="45"
            data-volume="cricketAudio">

        </div>

      </div>


      <!-- BACKGROUND AUDIO -->

      <audio
        id="natureAudio"
        src="nature.mp3"
        loop>
      </audio>

      <audio
        id="rainAudio"
        src="rain.mp3"
        loop>
      </audio>

      <audio
        id="cricketAudio"
        src="cricket.mp3"
        loop>
      </audio>


    </div>


    <!-- FOOTER -->
    <footer class="footer">

      <div>
        TERRITORY BOYS
      </div>

      <a
        href="https://www.instagram.com/jobn_skariah/"
        target="_blank">
        @jobn_skariah
      </a>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
